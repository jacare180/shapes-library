<script>try { if (localStorage.getItem("shapes-look") === "moderno") document.documentElement.dataset.theme = "moderno"; } catch (e) {}</script>
<title>ShapeX Library</title>
<meta name="description" content="Biblioteca particular: livros lidos, leituras em andamento, anotações, notas e metas.">
<meta name="theme-color" content="#1c120c">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Epilogue:wght@400;600;700&display=swap">

<link rel="stylesheet" href="/css/modern.css">

<header class="top" hidden>
  <a class="plaque" href="#/" aria-label="ShapeX Library, ir para a estante">

      <rect class="lm-1" x="2" y="6" width="8" height="24" rx="2.5"/>
      <rect class="lm-2" x="12" y="2" width="9" height="28" rx="2.5"/>
      <rect class="lm-3" x="23" y="9" width="7" height="21" rx="2.5"/>
      <rect class="lm-4" x="31" y="8" width="7" height="22" rx="2.5" transform="rotate(14 31 30)"/>
    </svg>
    <span class="wordmark"><b>ShapeX</b> Library</span>
  </a>
  <nav>
    <a href="#/" data-nav="estante">Estante</a>
    <a href="#/metas" data-nav="metas">Metas</a>
    <a href="#/ajustes" data-nav="ajustes">Ajustes</a>
    <button class="brass" id="add-book" type="button">+ Novo livro</button>
  </nav>
</header>
<main id="view"></main>
<div id="book-layer" hidden></div>
<dialog id="modal"></dialog>
<script type="module" src="/js/app.js"></script>
